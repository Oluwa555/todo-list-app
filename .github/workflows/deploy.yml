# Tests, builds and publishes the app to GitHub Pages.
#
# This runs on every push to main, so the live site updates automatically.
# You can also start it by hand from the Actions tab (workflow_dispatch).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# These permissions are what let the job publish to Pages using a short lived
# token instead of a stored password.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive together, keep only the newest deploy running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4